# Gera o app iOS na nuvem (Mac do GitHub, grátis em repositório público) e envia para o TestFlight.
# Antes de usar, cadastre estes "Secrets" no repositório (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID        – ID da chave da API do App Store Connect (crie a chave com acesso ADMIN: só ela permite a assinatura automática na nuvem)
#   ASC_ISSUER_ID     – Issuer ID (aparece na mesma página da chave)
#   ASC_KEY_P8        – conteúdo do arquivo AuthKey_XXXX.p8 (copie e cole o texto inteiro)
#   APPLE_TEAM_ID     – Team ID da conta de desenvolvedor (Membership details)
#   APP_TOKEN         – (opcional) uma senha qualquer, igual à do servidor, para só o app usar a IA
# E esta "Variable" (aba Variables, não Secrets):
#   SERVIDOR_URL      – endereço do servidor da Cloudflare, ex.: https://escudo-amigo.SEU-NOME.workers.dev
# Depois: aba Actions > "iOS · TestFlight" > Run workflow > escreva a versão (1.0, 1.1, 1.2…).
name: iOS · TestFlight
on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão da loja (1.0, 1.1, 1.2 …)'
        required: true
        default: '1.0'
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Instalar Capacitor e preparar o app
        working-directory: app-nativo
        env:
          SERVIDOR_URL: ${{ vars.SERVIDOR_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          npm install
          npm run www
          [ -d ios ] || npx cap add ios
          npx cap sync ios
          npx @capacitor/assets generate --ios --iconBackgroundColor '#FFFFFF' --splashBackgroundColor '#FFFFFF' --assetPath recursos || true
      - name: Textos de permissão, versão e número do build
        working-directory: app-nativo/ios/App/App
        run: |
          P=Info.plist
          set_() { /usr/libexec/PlistBuddy -c "Set :$1 $2" $P 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$1 string $2" $P; }
          set_ NSMicrophoneUsageDescription "Para você falar com o Escudo Amigo em vez de digitar e para gravar a sua consulta médica, quando você pedir."
          set_ NSSpeechRecognitionUsageDescription "Para transformar a sua fala em texto e entender o que você pediu."
          set_ NSCameraUsageDescription "Para tirar foto da caixa do remédio, da conta ou de uma mensagem suspeita, quando você tocar em Foto."
          set_ NSPhotoLibraryUsageDescription "Para escolher um print ou foto que você quer que o Escudo Amigo confira."
          set_ NSContactsUsageDescription "Para você escolher, na sua agenda, as pessoas da família que o app deve chamar em caso de ajuda."
          set_ CFBundleShortVersionString "${{ github.event.inputs.versao }}"
          set_ CFBundleVersion "${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Delete :UIRequiredDeviceCapabilities" $P || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $P || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" $P
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string pt-BR" $P || /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion pt-BR" $P
      - name: Manifesto de privacidade (exigido pela Apple)
        working-directory: app-nativo/ios/App
        run: |
          cat > App/PrivacyInfo.xcprivacy <<'PL'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>NSPrivacyTracking</key><false/>
            <key>NSPrivacyTrackingDomains</key><array/>
            <key>NSPrivacyCollectedDataTypes</key><array>
              <dict><key>NSPrivacyCollectedDataType</key><string>NSPrivacyCollectedDataTypeDeviceID</string>
                <key>NSPrivacyCollectedDataTypeLinked</key><false/><key>NSPrivacyCollectedDataTypeTracking</key><false/>
                <key>NSPrivacyCollectedDataTypePurposes</key><array><string>NSPrivacyCollectedDataTypePurposeAppFunctionality</string></array></dict>
            </array>
            <key>NSPrivacyAccessedAPITypes</key><array>
              <dict><key>NSPrivacyAccessedAPIType</key><string>NSPrivacyAccessedAPICategoryUserDefaults</string>
                <key>NSPrivacyAccessedAPITypeReasons</key><array><string>CA92.1</string></array></dict>
              <dict><key>NSPrivacyAccessedAPIType</key><string>NSPrivacyAccessedAPICategoryFileTimestamp</string>
                <key>NSPrivacyAccessedAPITypeReasons</key><array><string>C617.1</string></array></dict>
            </array>
          </dict></plist>
          PL
          gem list xcodeproj -i >/dev/null || sudo gem install xcodeproj --no-document
          ruby -e 'require "xcodeproj"; p=Xcodeproj::Project.open("App.xcodeproj"); t=p.targets.find{|x| x.name=="App"}; g=p.main_group.find_subpath("App",false); unless g.files.any?{|f| f.path=="PrivacyInfo.xcprivacy"}; f=g.new_reference("PrivacyInfo.xcprivacy"); t.resources_build_phase.add_file_reference(f); p.save; end'
      - name: Textos de permissão em português de Portugal
        working-directory: app-nativo/ios/App
        run: |
          mkdir -p App/pt-PT.lproj
          cat > App/pt-PT.lproj/InfoPlist.strings <<'ST'
          "NSMicrophoneUsageDescription" = "Para falar com o Escudo Amigo em vez de escrever e para gravar a sua consulta médica, quando pedir.";
          "NSSpeechRecognitionUsageDescription" = "Para transformar a sua fala em texto e perceber o que pediu.";
          "NSCameraUsageDescription" = "Para tirar uma fotografia à caixa do remédio, à conta ou a uma mensagem suspeita, quando tocar em Foto.";
          "NSPhotoLibraryUsageDescription" = "Para escolher uma captura de ecrã ou fotografia que quer que o Escudo Amigo verifique.";
          "NSContactsUsageDescription" = "Para escolher, nos seus contactos, as pessoas da família que a app deve chamar em caso de ajuda.";
          ST
          ruby -e 'require "xcodeproj"; p=Xcodeproj::Project.open("App.xcodeproj"); t=p.targets.find{|x| x.name=="App"}; g=p.main_group.find_subpath("App",false); unless g.children.any?{|f| f.display_name=="InfoPlist.strings"}; v=g.new_variant_group("InfoPlist.strings"); v.new_reference("pt-PT.lproj/InfoPlist.strings").name="pt-PT"; t.resources_build_phase.add_file_reference(v); end; p.root_object.known_regions|=["pt-BR","pt-PT"]; p.save'
      - name: Conferir segredos da Apple
        id: seg
        env:
          A: ${{ secrets.ASC_KEY_ID }}
          B: ${{ secrets.ASC_ISSUER_ID }}
          C: ${{ secrets.ASC_KEY_P8 }}
          D: ${{ secrets.APPLE_TEAM_ID }}
          E: ${{ vars.SERVIDOR_URL }}
        run: |
          falta=""
          [ -n "$A" ] || falta="$falta ASC_KEY_ID"; [ -n "$B" ] || falta="$falta ASC_ISSUER_ID"; [ -n "$C" ] || falta="$falta ASC_KEY_P8"; [ -n "$D" ] || falta="$falta APPLE_TEAM_ID"
          [ -n "$E" ] || echo "::warning::Falta a variável SERVIDOR_URL: o app vai sem a IA na nuvem (a assinatura não entregaria nada)."
          echo "falta=$falta" >> $GITHUB_OUTPUT
          [ -z "$falta" ] || echo "::warning::Faltam os segredos:$falta. Vou só testar se o app compila (sem enviar para a Apple)."
      - name: Teste de compilação (sem assinatura)
        if: steps.seg.outputs.falta != ''
        working-directory: app-nativo/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO | tail -40
          echo "::error::O app compila. Para enviar ao TestFlight, cadastre os segredos:${{ steps.seg.outputs.falta }} (veja PUBLICAR.md, Parte C)."
          exit 1
      - name: Chave do App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: Compilar (archive) com assinatura automática
        working-directory: app-nativo/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath $RUNNER_TEMP/App.xcarchive archive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
      - name: Exportar e enviar para o TestFlight
        run: |
          cat > $RUNNER_TEMP/export.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>destination</key><string>upload</string>
          <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string><key>signingStyle</key><string>automatic</string></dict></plist>
          PL
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $RUNNER_TEMP/export -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
          echo "Enviado. Em 10–30 minutos o build aparece no App Store Connect > TestFlight."
